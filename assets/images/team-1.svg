<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#FDF5E6"/>
  <circle cx="200" cy="200" r="150" fill="#D2691E" opacity="0.06"/>

  <!-- Shoulders / Apron -->
  <path d="M80 400 L80 340 Q80 300 130 290 L270 290 Q320 300 320 340 L320 400 Z" fill="#D2691E"/>
  <path d="M100 400 L100 350 Q100 320 140 310 L260 310 Q300 320 300 350 L300 400 Z" fill="#E8C39E" opacity="0.5"/>

  <!-- Neck (narrower than face, rounded top) -->
